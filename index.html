<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Extensions LLM Chat</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="panel-root">
      <!-- Header: provider badge + model selector -->
      <div class="chat-header">
        <span class="model-badge">Cloud.ru</span>
        <div id="model-selector" class="model-selector" role="group" aria-label="Model selector"></div>
      </div>

      <!-- Chat content -->
      <div class="chat-content">
        <div id="chat-transcript" class="chat-transcript"></div>
        <div id="active-comp-note" class="active-comp-note">Active composition: loading...</div>
        <div id="status-line" class="status-line">
          <span id="status-text">Ready</span>
          <span id="model-status" class="model-status model-status-unknown">model: unknown</span>
          <span id="context-meter" class="context-meter" title="Context sent to the model. As it fills, the oldest history is trimmed from what the model sees — your visible transcript is never touched. Click to compact now.">
            <span class="context-meter-bar"><span id="context-meter-fill" class="context-meter-fill"></span></span>
            <span id="context-meter-text" class="context-meter-text">ctx 0%</span>
          </span>
          <label class="vision-toggle" title="Visual check after changes (~5s, MiniMax-M3)">
            <input type="checkbox" id="vision-check-toggle" checked />
            <span class="vision-toggle-label">Visual check</span>
          </label>
        </div>

        <!-- Quick actions: two demand-ranked rows (2026-07 research).
             Row 1 = single expressions (wiggle/loop/bounce top every list;
             auto-resize text box is the most-asked question on Adobe forums).
             Row 2 = task-level animations (people search for outcomes, not
             expressions: stagger, pop-in, camera shake, draw-on…). -->
        <div class="quick-actions" id="quick-actions">
          <button class="quick-action-btn" data-prompt="Add wiggle(3, 25) to selected layers" title="Apply wiggle expression to selection">Wiggle</button>
          <button class="quick-action-btn" data-prompt="Loop existing keyframes on selected layers with loopOut cycle" title="Repeat keyframed animation forever">Loop</button>
          <button class="quick-action-btn" data-prompt="Add bounce easing expression to all keyframes on selected layers" title="Bounce overshoot on keyframes">Bounce</button>
          <button class="quick-action-btn" data-prompt="Create a counter from 0 to 100 on selected text layer" title="Counter expression on text">Counter</button>
          <button class="quick-action-btn" data-prompt="Create an auto-resizing background box behind the selected text layer using sourceRectAtTime, anchored so it works with left/right text alignment too" title="Auto-resizing text background (lower third)">Text Box</button>
          <button class="quick-action-btn" data-prompt="Add auto fade in/out expression to opacity of selected layers" title="Fade at layer in/out points, no keyframes">Fade</button>
          <button class="quick-action-btn" data-prompt="Make selected layers rotate continuously using a time expression" title="Endless rotation without keyframes">Spin</button>
          <button class="quick-action-btn" data-prompt="Capture current frame preview" title="Save and show current comp frame">Preview</button>
        </div>
        <div class="quick-actions" id="quick-actions-tasks">
          <button class="quick-action-btn" data-prompt="Stagger the selected layers: offset each layer's animation to start 3 frames after the previous one" title="Cascade layers with 3-frame offsets">Stagger</button>
          <button class="quick-action-btn" data-prompt="Make selected layers pop in: center each anchor point without shifting the layer, then animate scale 0 to 100 with a spring overshoot at the layer in point" title="Scale 0→100 with overshoot from centered anchor">Pop In</button>
          <button class="quick-action-btn" data-prompt="Add a typewriter text reveal to the selected text layer" title="Reveal text letter by letter">Typewriter</button>
          <button class="quick-action-btn" data-prompt="Add camera shake to this composition: an adjustment or null rig with slider-driven wiggle, scaled ~103% so edges never show" title="Slider-controlled camera shake rig">Cam Shake</button>
          <button class="quick-action-btn" data-prompt="Animate the selected shape layer's stroke drawing on with Trim Paths from 0 to 100" title="Draw-on line reveal via Trim Paths">Draw-On</button>
          <button class="quick-action-btn" data-prompt="Make selected layers slide in from the left with smooth easing at their in points" title="Eased slide-in entrance">Slide In</button>
          <button class="quick-action-btn" data-prompt="Apply smooth easy ease with a slight overshoot to all existing keyframes on selected layers" title="Polish existing keyframes: ease + overshoot">Smooth Ease</button>
          <button class="quick-action-btn" data-prompt="Move the anchor point of each selected layer to its center without shifting the layer" title="Center anchor points (compensated)">Center Anchor</button>
        </div>

        <div class="chat-input-container">
          <textarea
            id="user-input"
            class="chat-input"
            rows="2"
            placeholder="Describe what to animate, create, or fix... (Enter to send, Shift+Enter for newline)"
          ></textarea>
          <div class="chat-actions">
            <button id="send-btn" class="btn btn-primary" title="Send message (Enter). Shift+Enter for new line.">Send</button>
            <button id="cancel-btn" class="btn btn-danger" style="display:none" title="Cancel the running agent">Stop</button>
          </div>
        </div>
      </div>

      <!-- Shared footer -->
      <div class="panel-footer">
        <button id="undo-btn" class="btn btn-warning" title="Undo ALL agent actions from last request">Undo</button>
        <button id="clear-session-btn" class="btn btn-secondary" title="Clear all messages in the current session">Clear</button>
        <button id="export-sessions-btn" class="btn btn-secondary" title="Export session to JSON on Desktop">Export</button>
        <button id="export-errors-btn" class="btn btn-secondary" title="Export errors only → JSON on Desktop">Errors</button>
        <button id="report-btn" class="btn btn-secondary" title="Analyze session with LLM and generate a bug report on Desktop">Report</button>
      </div>
    </div>

    <!-- Config (load order matters) -->
    <script src="./config/example.config.js"></script>
    <script src="./config/runtime-config.js"></script>
    <script src="./config/secrets.local.js"></script>

    <!-- Libraries -->
    <script src="./lib/CSInterface.js"></script>

    <!-- Pure helpers (must load before hostBridge.js / main.js that consume them) -->
    <script src="./lib/pure/esLiteral.js"></script>
    <script src="./lib/pure/markdown.js"></script>
    <script src="./lib/pure/prune.js"></script>
    <script src="./lib/pure/expressionLibrary.js"></script>
    <script src="./lib/pure/theme.js"></script>
    <script src="./lib/pure/visionCheck.js"></script>
    <script src="./lib/pure/pricing.js"></script>

    <!-- Agent modules -->
    <script src="./toolRegistry.js"></script>
    <script src="./agentSystemPrompt.js"></script>
    <script src="./chatProvider.js"></script>
    <script src="./hostBridge.js"></script>
    <script src="./agentToolLoop.js"></script>

    <!-- Main runtime (must be last) -->
    <script src="./main.js"></script>
  </body>
</html>
