<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Extensions LLM Chat</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="panel-root">
      <!-- Header: provider badge + model selector -->
      <div class="chat-header">
        <span id="provider-badge" class="model-badge" title="Click to re-check which models the account can call">Cloud.ru</span>
        <div id="model-selector" class="model-selector" role="group" aria-label="Model selector"></div>
      </div>

      <!-- Chat switcher: multiple named sessions (2026-07-27) -->
      <div class="session-bar">
        <select id="session-select" class="session-select" title="Switch chat"></select>
        <button id="session-new-btn" class="btn btn-secondary session-btn" title="New chat">+</button>
        <button id="session-rename-btn" class="btn btn-secondary session-btn" title="Rename this chat">&#9998;</button>
        <button id="session-delete-btn" class="btn btn-secondary session-btn" title="Delete this chat">&#215;</button>
      </div>

      <!-- Chat content -->
      <div class="chat-content">
        <div id="chat-transcript" class="chat-transcript"></div>
        <div id="active-comp-note" class="active-comp-note">Active composition: loading...</div>
        <div id="status-line" class="status-line">
          <span id="status-text">Ready</span>
          <span id="model-status" class="model-status model-status-unknown">model: unknown</span>
          <span id="context-meter" class="context-meter" title="Context sent to the model. As it fills, the oldest history is trimmed from what the model sees — your visible transcript is never touched. Click to compact now.">
            <span class="context-meter-bar"><span id="context-meter-fill" class="context-meter-fill"></span></span>
            <span id="context-meter-text" class="context-meter-text">ctx 0%</span>
          </span>
          <label class="vision-toggle" title="Visual check after changes (~5s, MiniMax-M3). Weak signal: checks ONE still frame — catches gross layout/color errors, does NOT verify motion or timing.">
            <input type="checkbox" id="vision-check-toggle" checked />
            <span class="vision-toggle-label">Visual check</span>
          </label>
        </div>

        <!-- Quick actions: rendered dynamically from lib/pure/quickActions.js
             (16 demand-ranked defaults, 2026-07 research) merged with the
             user's edits/additions from localStorage. Left-click = send,
             right-click = edit/delete, "+" = add, "⟲" = reset to defaults. -->
        <div class="quick-actions" id="quick-actions"></div>

        <!-- Task bar: one-click tool pipelines that run directly (no LLM
             round-trip). Their controls live in the Subtitles studio overlay
             (below) so the chat area stays uncluttered; only the opener and a
             live stage/elapsed status stay here. -->
        <div class="task-bar">
          <button id="subtitles-open-btn" class="btn btn-secondary task-btn" title="Open the subtitle studio: language, style, font, size and colors, then transcribe and build">Subtitles&hellip;</button>
          <span id="subtitles-status" class="task-status"></span>
        </div>

        <div class="chat-input-container">
          <textarea
            id="user-input"
            class="chat-input"
            rows="2"
            placeholder="Describe what to animate, create, or fix... (Enter to send, Shift+Enter for newline)"
          ></textarea>
          <div class="chat-actions">
            <button id="send-btn" class="btn btn-primary" title="Send message (Enter). Shift+Enter for new line.">Send</button>
            <button id="cancel-btn" class="btn btn-danger" style="display:none" title="Cancel the running agent">Stop</button>
          </div>
        </div>
      </div>

      <!-- Subtitles studio (2026-08-04): every subtitle control lives here so
           it does not mix with the chat/quick actions. Opened from the task
           bar, closed with × or Esc. Colors are hex fields + a swatch (CEF has
           no native color picker, so <input type="color"> would be dead). -->
      <div id="subtitles-panel" class="studio-panel" style="display:none" role="dialog" aria-label="Subtitles studio">
        <div class="studio-head">
          <span class="studio-title">Subtitles</span>
          <button id="subtitles-close-btn" class="btn btn-secondary session-btn" title="Close (Esc)">&#215;</button>
        </div>
        <div class="studio-body">
          <div class="studio-row">
            <label for="subtitles-lang">Language</label>
            <select id="subtitles-lang" class="task-select" title="Spoken language — Whisper requires it">
              <option value="ru" selected>RU</option>
              <option value="en">EN</option>
              <option value="de">DE</option>
              <option value="es">ES</option>
              <option value="fr">FR</option>
              <option value="it">IT</option>
              <option value="pt">PT</option>
              <option value="zh">ZH</option>
              <option value="ja">JA</option>
              <option value="ko">KO</option>
            </select>
          </div>
          <div class="studio-row">
            <label for="subtitles-style">Style</label>
            <select id="subtitles-style" class="task-select" title="Animation style: Reveal = words appear one by one; Karaoke = CapCut-style plate under the spoken word; Plain = whole cue at once">
              <option value="word_reveal" selected>Reveal</option>
              <option value="karaoke">Karaoke</option>
              <option value="none">Plain</option>
            </select>
          </div>
          <div class="studio-row">
            <label for="subtitles-font">Font</label>
            <select id="subtitles-font" class="task-select studio-input" title="Installed font families, read from After Effects. Default: SB Sans Text."></select>
            <select id="subtitles-font-style" class="task-select studio-input-style" title="Weight / style of the chosen family"></select>
          </div>
          <div class="studio-row">
            <label for="subtitles-font-size">Size</label>
            <input id="subtitles-font-size" class="studio-input studio-input-num" type="number" min="8" max="600" step="1" placeholder="Auto" title="Font size in px. Empty = auto-fit to 92% of comp width. The karaoke plate and its padding scale with this value." />
          </div>
          <div class="studio-row">
            <label for="subtitles-color">Text color</label>
            <input id="subtitles-color" class="studio-input studio-input-hex" type="text" maxlength="7" value="#ffffff" title="Subtitle text color (hex)" />
            <span id="subtitles-color-sw" class="color-swatch"></span>
          </div>
          <div class="studio-row karaoke-only">
            <label for="subtitles-plate-color">Plate</label>
            <input id="subtitles-plate-color" class="studio-input studio-input-hex" type="text" maxlength="7" value="#ffd700" title="Karaoke plate color (hex)" />
            <span id="subtitles-plate-color-sw" class="color-swatch"></span>
          </div>
          <div class="studio-row karaoke-only">
            <label for="subtitles-spoken-color">Spoken word</label>
            <input id="subtitles-spoken-color" class="studio-input studio-input-hex" type="text" maxlength="7" value="#0f0f0f" title="Color of the word currently on the plate (hex)" />
            <span id="subtitles-spoken-color-sw" class="color-swatch"></span>
          </div>
          <div class="studio-actions">
            <button id="subtitles-btn" class="btn btn-primary task-btn" title="Transcribe comp audio (Whisper) and build the subtitle layer">Transcribe + build</button>
            <button id="subtitles-rebuild-btn" class="btn btn-secondary task-btn" title="Build the subtitle layer again from the cached/loaded transcript — no transcription, use it to try another style or colors">Rebuild</button>
            <button id="transcript-save-btn" class="btn btn-secondary task-btn" title="Save the last transcript (segments + silence map) as JSON on the Desktop">Save transcript</button>
            <button id="transcript-load-btn" class="btn btn-secondary task-btn" title="Load a saved transcript JSON and reuse it for Rebuild">Load transcript</button>
          </div>
          <div class="studio-hint">Готовые субтитры правятся через чат агента: напишите &laquo;покажи субтитры&raquo;, затем &laquo;исправь X на Y&raquo; &mdash; текст обновится на месте, тайминги и анимация не собьются.</div>
          <div id="subtitles-panel-status" class="task-status studio-status"></div>
        </div>
      </div>

      <!-- Shared footer -->
      <div class="panel-footer">
        <button id="undo-btn" class="btn btn-warning" title="Undo ALL agent actions from last request">Undo</button>
        <button id="clear-session-btn" class="btn btn-secondary" title="Clear messages in THIS chat. Right-click: delete ALL chats and start fresh.">Clear</button>
        <button id="export-sessions-btn" class="btn btn-secondary" title="Export session to JSON on Desktop">Export</button>
        <button id="export-errors-btn" class="btn btn-secondary" title="Export errors only → JSON on Desktop">Errors</button>
        <button id="report-btn" class="btn btn-secondary" title="Analyze session with LLM and generate a bug report on Desktop">Report</button>
        <span class="footer-spacer"></span>
        <span id="version-info" class="version-info">v?</span>
        <button id="update-btn" class="btn btn-secondary" title="Check for updates on GitHub">Update</button>
      </div>
    </div>

    <!-- Config (load order matters) -->
    <script src="./config/example.config.js"></script>
    <script src="./config/runtime-config.js"></script>
    <script src="./config/secrets.local.js"></script>

    <!-- Libraries -->
    <script src="./lib/CSInterface.js"></script>

    <!-- Pure helpers (must load before hostBridge.js / main.js that consume them) -->
    <script src="./lib/pure/esLiteral.js"></script>
    <script src="./lib/pure/markdown.js"></script>
    <script src="./lib/pure/prune.js"></script>
    <script src="./lib/pure/sessionStore.js"></script>
    <script src="./lib/pure/quickActions.js"></script>
    <script src="./lib/pure/expressionLibrary.js"></script>
    <script src="./lib/pure/userExpressionLibrary.js"></script>
    <script src="./lib/pure/subtitles.js"></script>
    <script src="./lib/pure/toolCallSalvage.js"></script>
    <script src="./lib/pure/doneGuard.js"></script>
    <script src="./lib/pure/theme.js"></script>
    <script src="./lib/pure/visionCheck.js"></script>
    <script src="./lib/pure/pricing.js"></script>
    <script src="./lib/pure/updater.js"></script>

    <!-- Agent modules -->
    <script src="./toolRegistry.js"></script>
    <script src="./agentSystemPrompt.js"></script>
    <script src="./chatProvider.js"></script>
    <script src="./hostBridge.js"></script>
    <script src="./agentToolLoop.js"></script>
    <script src="./updater.js"></script>

    <!-- Main runtime (must be last) -->
    <script src="./main.js"></script>
  </body>
</html>
