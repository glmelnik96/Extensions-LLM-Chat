<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Extensions LLM Chat</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="panel-root">
      <!-- Header: provider badge + model selector -->
      <div class="chat-header">
        <span class="model-badge">Cloud.ru</span>
        <div id="model-selector" class="model-selector" role="group" aria-label="Model selector"></div>
      </div>

      <!-- Chat switcher: multiple named sessions (2026-07-27) -->
      <div class="session-bar">
        <select id="session-select" class="session-select" title="Switch chat"></select>
        <button id="session-new-btn" class="btn btn-secondary session-btn" title="New chat">+</button>
        <button id="session-rename-btn" class="btn btn-secondary session-btn" title="Rename this chat">&#9998;</button>
        <button id="session-delete-btn" class="btn btn-secondary session-btn" title="Delete this chat">&#215;</button>
      </div>

      <!-- Chat content -->
      <div class="chat-content">
        <div id="chat-transcript" class="chat-transcript"></div>
        <div id="active-comp-note" class="active-comp-note">Active composition: loading...</div>
        <div id="status-line" class="status-line">
          <span id="status-text">Ready</span>
          <span id="model-status" class="model-status model-status-unknown">model: unknown</span>
          <span id="context-meter" class="context-meter" title="Context sent to the model. As it fills, the oldest history is trimmed from what the model sees — your visible transcript is never touched. Click to compact now.">
            <span class="context-meter-bar"><span id="context-meter-fill" class="context-meter-fill"></span></span>
            <span id="context-meter-text" class="context-meter-text">ctx 0%</span>
          </span>
          <label class="vision-toggle" title="Visual check after changes (~5s, MiniMax-M3)">
            <input type="checkbox" id="vision-check-toggle" checked />
            <span class="vision-toggle-label">Visual check</span>
          </label>
        </div>

        <!-- Quick actions: rendered dynamically from lib/pure/quickActions.js
             (16 demand-ranked defaults, 2026-07 research) merged with the
             user's edits/additions from localStorage. Left-click = send,
             right-click = edit/delete, "+" = add, "⟲" = reset to defaults. -->
        <div class="quick-actions" id="quick-actions"></div>

        <div class="chat-input-container">
          <textarea
            id="user-input"
            class="chat-input"
            rows="2"
            placeholder="Describe what to animate, create, or fix... (Enter to send, Shift+Enter for newline)"
          ></textarea>
          <div class="chat-actions">
            <button id="send-btn" class="btn btn-primary" title="Send message (Enter). Shift+Enter for new line.">Send</button>
            <button id="cancel-btn" class="btn btn-danger" style="display:none" title="Cancel the running agent">Stop</button>
          </div>
        </div>
      </div>

      <!-- Shared footer -->
      <div class="panel-footer">
        <button id="undo-btn" class="btn btn-warning" title="Undo ALL agent actions from last request">Undo</button>
        <button id="clear-session-btn" class="btn btn-secondary" title="Clear messages in THIS chat. Right-click: delete ALL chats and start fresh.">Clear</button>
        <button id="export-sessions-btn" class="btn btn-secondary" title="Export session to JSON on Desktop">Export</button>
        <button id="export-errors-btn" class="btn btn-secondary" title="Export errors only → JSON on Desktop">Errors</button>
        <button id="report-btn" class="btn btn-secondary" title="Analyze session with LLM and generate a bug report on Desktop">Report</button>
        <span class="footer-spacer"></span>
        <span id="version-info" class="version-info">v?</span>
        <button id="update-btn" class="btn btn-secondary" title="Check for updates on GitHub">Update</button>
      </div>
    </div>

    <!-- Config (load order matters) -->
    <script src="./config/example.config.js"></script>
    <script src="./config/runtime-config.js"></script>
    <script src="./config/secrets.local.js"></script>

    <!-- Libraries -->
    <script src="./lib/CSInterface.js"></script>

    <!-- Pure helpers (must load before hostBridge.js / main.js that consume them) -->
    <script src="./lib/pure/esLiteral.js"></script>
    <script src="./lib/pure/markdown.js"></script>
    <script src="./lib/pure/prune.js"></script>
    <script src="./lib/pure/sessionStore.js"></script>
    <script src="./lib/pure/quickActions.js"></script>
    <script src="./lib/pure/expressionLibrary.js"></script>
    <script src="./lib/pure/userExpressionLibrary.js"></script>
    <script src="./lib/pure/theme.js"></script>
    <script src="./lib/pure/visionCheck.js"></script>
    <script src="./lib/pure/pricing.js"></script>
    <script src="./lib/pure/updater.js"></script>

    <!-- Agent modules -->
    <script src="./toolRegistry.js"></script>
    <script src="./agentSystemPrompt.js"></script>
    <script src="./chatProvider.js"></script>
    <script src="./hostBridge.js"></script>
    <script src="./agentToolLoop.js"></script>
    <script src="./updater.js"></script>

    <!-- Main runtime (must be last) -->
    <script src="./main.js"></script>
  </body>
</html>
